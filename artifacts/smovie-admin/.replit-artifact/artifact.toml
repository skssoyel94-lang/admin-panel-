kind = "mobile"
previewPath = "/"
title = "sMovie Admin"
description = "A mobile-first OTT content library admin app for managing movies, series, metadata, episodes, and publishing settings."
version = "1.0.0"
id = "artifacts/smovie-admin"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25204

[services.development]
run = "pnpm --filter @workspace/smovie-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smovie-admin", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/smovie-admin", "run", "serve" ]

[services.env]
PORT = "25204"
BASE_PATH = "/"
